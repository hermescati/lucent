version: 2

updates:
  # Once a month, every npm update lands as one pull request that CI tests together.
  - package-ecosystem: npm
    directories: ['/', '/example']
    schedule:
      interval: monthly
    # Major upgrades are done by hand: an Expo SDK upgrade with `npx expo install --fix`, which picks a matching set
    # of versions, and tools like Babel, ESLint or TypeScript, which can need config changes.
    # React must match the renderer React Native ships, so it only moves with the SDK.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@react-native/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
    groups:
      dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
