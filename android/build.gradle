plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.lucent'
version = '0.1.0'

android {
  namespace "expo.modules.lucent"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles 'consumer-rules.pro'
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // The back gesture's progress (`OnBackPressedCallback.handleOnBackProgressed`) came in 1.8.
  implementation 'androidx.activity:activity:1.8.0'
}
